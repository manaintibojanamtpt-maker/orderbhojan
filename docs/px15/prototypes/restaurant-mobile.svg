  <text x="187" y="747" text-anchor="middle" font-size="15" font-weight="700" fill="#FFFAF3">Open Menu</text>
  <!-- MiniNavIsland -->
  <rect x="100" y="776" width="175" height="36" rx="18" fill="url(#glass)" stroke="rgba(255,170,95,0.12)"/>
  <text x="130" y="798" font-size="10" fill="#FFFAF3">� Back</text>
  <text x="187" y="798" text-anchor="middle" font-size="10" fill="#FF7A00">Home</text>
  <text x="244" y="798" font-size="10" fill="#FFFAF3">Cart</text>
</svg>
