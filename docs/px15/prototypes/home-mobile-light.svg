<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="title desc">
  <title id="title">OrderBhojan Home  Mobile Light  PX1.5 Design Prototype</title>
  <desc id="desc">375x812 light mode. Hero 40vh food-dominant. Search integrated in hero. Category rail. Restaurant immersive cards. NavIsland bottom.</desc>
  <!-- Background -->
  <rect width="375" height="812" fill="#FFFAF3"/>
  <!-- HERO 40% = 325px -->
  <defs>
    <linearGradient id="heroFood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF9F43"/>
      <stop offset="40%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </linearGradient>
    <linearGradient id="heroScrimLight" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#FFFAF3" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#FFFAF3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFF8F0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFF8F0" stop-opacity="0.75"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="375" height="325" fill="url(#heroFood)"/>
  <!-- Food texture suggestion -->
  <ellipse cx="280" cy="120" rx="90" ry="70" fill="#FF7A00" opacity="0.3"/>
  <ellipse cx="120" cy="180" rx="100" ry="80" fill="#FFB366" opacity="0.25"/>
  <rect x="0" y="0" width="375" height="325" fill="url(#heroScrimLight)"/>
  <!-- Safe top -->
  <rect x="0" y="0" width="375" height="47" fill="none" stroke="#FF7A00" stroke-width="0.5" stroke-dasharray="4 4" opacity="0.4"/>
  <!-- Location chip -->
  <rect x="16" y="52" width="130" height="32" rx="16" fill="url(#glassLight)" stroke="rgba(255,122,0,0.15)"/>
  <circle cx="32" cy="68" r="6" fill="#FF7A00"/>
  <text x="44" y="72" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="600" fill="#120D0A">Kondapur, Hyderabad</text>
  <!-- Hero copy -->
  <text x="16" y="200" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="900" letter-spacing="2.5" fill="#FF7A00">NEAR YOU</text>
  <text x="16" y="248" font-family="Outfit,sans-serif" font-size="36" font-weight="900" fill="#120D0A">Hyderabadi</text>
  <text x="16" y="288" font-family="Outfit,sans-serif" font-size="36" font-weight="900" fill="#120D0A">Dum Biryani</text>
  <text x="16" y="312" font-family="Plus Jakarta Sans,sans-serif" font-size="14" fill="#6B635C">Slow-cooked comfort, Andhra spice</text>
  <!-- Search pill in hero -->
  <rect x="16" y="332" width="343" height="48" rx="24" fill="url(#glassLight)" stroke="rgba(255,122,0,0.2)"/>
  <circle cx="40" cy="356" r="8" fill="none" stroke="#6B635C" stroke-width="1.5"/>
  <line x1="46" y1="362" x2="52" y2="368" stroke="#6B635C" stroke-width="1.5"/>
  <text x="60" y="360" font-family="Plus Jakarta Sans,sans-serif" font-size="14" fill="#8A8178">Search restaurants, dishes...</text>
  <!-- Categories -->
  <text x="16" y="420" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="900" letter-spacing="2" fill="#FF7A00">CRAVE</text>
  <g transform="translate(16,432)">
    <circle cx="36" cy="36" r="36" fill="#FFEDD5" stroke="#FF7A00" stroke-width="2"/>
    <text x="36" y="88" text-anchor="middle" font-family="Plus Jakarta Sans,sans-serif" font-size="11" fill="#120D0A">Biryani</text>
    <circle cx="100" cy="36" r="36" fill="#FFEDD5"/>
    <text x="100" y="88" text-anchor="middle" font-size="11" fill="#120D0A">Dosa</text>
    <circle cx="164" cy="36" r="36" fill="#FFEDD5"/>
    <text x="164" y="88" text-anchor="middle" font-size="11" fill="#120D0A">Curry</text>
    <circle cx="228" cy="36" r="36" fill="#FFEDD5"/>
    <text x="228" y="88" text-anchor="middle" font-size="11" fill="#120D0A">Snacks</text>
  </g>
  <!-- Restaurant section -->
  <text x="16" y="548" font-family="Plus Jakarta Sans,sans-serif" font-size="10" font-weight="900" letter-spacing="2" fill="#FF7A00">RESTAURANTS</text>
  <text x="16" y="572" font-family="Outfit,sans-serif" font-size="22" font-weight="800" fill="#120D0A">Near you</text>
  <!-- Restaurant card 1 -->
  <rect x="16" y="588" width="260" height="168" rx="28" fill="#FFF8F0" filter="url(#shadow)"/>
  <defs><filter id="shadow"><feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#FF6B35" flood-opacity="0.12"/></filter></defs>
  <rect x="16" y="588" width="260" height="130" rx="28" fill="#FF6B35"/>
  <rect x="16" y="650" width="260" height="68" rx="0" fill="#FFF8F0"/>
  <text x="32" y="692" font-family="Plus Jakarta Sans,sans-serif" font-size="15" font-weight="700" fill="#120D0A">Demo Biryani House</text>
  <text x="32" y="710" font-family="Plus Jakarta Sans,sans-serif" font-size="11" fill="#6B635C"> 4.8 � 25 min � �40 delivery</text>
  <!-- Restaurant card 2 peek -->
  <rect x="288" y="588" width="260" height="168" rx="28" fill="#FFF8F0" opacity="0.6"/>
  <!-- NavIsland -->
  <rect x="28" y="732" width="319" height="64" rx="32" fill="url(#glassLight)" stroke="rgba(255,122,0,0.15)"/>
  <circle cx="75" cy="764" r="4" fill="#FF7A00"/>
  <text x="75" y="782" text-anchor="middle" font-size="9" fill="#FF7A00">Home</text>
  <text x="131" y="782" text-anchor="middle" font-size="9" fill="#8A8178">Search</text>
  <text x="187" y="782" text-anchor="middle" font-size="9" fill="#8A8178">Cart</text>
  <text x="243" y="782" text-anchor="middle" font-size="9" fill="#8A8178">Orders</text>
  <text x="299" y="782" text-anchor="middle" font-size="9" fill="#8A8178">Profile</text>
  <!-- Annotations -->
  <text x="360" y="162" font-size="8" fill="#FF7A00" transform="rotate(-90 360 162)">HERO 40vh</text>
  <text x="360" y="356" font-size="8" fill="#FF7A00" transform="rotate(-90 360 356)">SEARCH IN HERO</text>
</svg>
