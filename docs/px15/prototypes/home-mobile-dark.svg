<svg xmlns="http://www.w3.org/2000/svg" width="375" height="812" viewBox="0 0 375 812" role="img" aria-labelledby="title desc">
  <title id="title">OrderBhojan Home  Mobile Dark (food theme)  PX1.5</title>
  <desc id="desc">375x812 warm dark #070504. MIB luxury dark. Same layout as light prototype.</desc>
  <rect width="375" height="812" fill="#070504"/>
  <defs>
    <linearGradient id="heroFoodD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8B4513"/>
      <stop offset="50%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#4A2010"/>
    </linearGradient>
    <linearGradient id="scrimD" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#070504" stop-opacity="0.92"/>
      <stop offset="55%" stop-color="#070504" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glassD" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#120D0A" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#120D0A" stop-opacity="0.72"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="375" height="325" fill="url(#heroFoodD)"/>
  <rect x="0" y="0" width="375" height="325" fill="url(#scrimD)"/>
  <rect x="16" y="52" width="130" height="32" rx="16" fill="url(#glassD)" stroke="rgba(255,170,95,0.12)"/>
  <circle cx="32" cy="68" r="6" fill="#FF7A00"/>
  <text x="44" y="72" font-family="Plus Jakarta Sans,sans-serif" font-size="11" font-weight="600" fill="#FFFAF3">Kondapur, Hyderabad</text>
  <text x="16" y="200" font-size="10" font-weight="900" letter-spacing="2.5" fill="#FF7A00">NEAR YOU</text>
