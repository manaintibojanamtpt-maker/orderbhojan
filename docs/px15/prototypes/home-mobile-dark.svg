  <text x="16" y="420" font-size="10" font-weight="900" letter-spacing="2" fill="#FF7A00">CRAVE</text>
  <g transform="translate(16,432)">
    <circle cx="36" cy="36" r="36" fill="#1A1410" stroke="#FF7A00" stroke-width="2"/>
