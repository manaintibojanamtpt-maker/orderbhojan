  <text x="16" y="288" font-family="Outfit,sans-serif" font-size="36" font-weight="900" fill="#FFFAF3">Dum Biryani</text>
  <text x="16" y="312" font-size="14" fill="#D0C4B5">Slow-cooked comfort, Andhra spice</text>
  <rect x="16" y="332" width="343" height="48" rx="24" fill="url(#glassD)" stroke="rgba(255,170,95,0.12)"/>
