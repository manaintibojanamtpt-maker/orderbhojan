    <circle cx="164" cy="36" r="36" fill="#1A1410"/>
  </g>
  <text x="16" y="548" font-size="10" font-weight="900" letter-spacing="2" fill="#FF7A00">RESTAURANTS</text>
  <text x="16" y="572" font-family="Outfit,sans-serif" font-size="22" font-weight="800" fill="#FFFAF3">Near you</text>
  <rect x="16" y="588" width="260" height="168" rx="28" fill="#120D0A"/>
  <rect x="16" y="588" width="260" height="130" rx="28" fill="#FF6B35" opacity="0.85"/>
  <text x="32" y="692" font-size="15" font-weight="700" fill="#FFFAF3">Demo Biryani House</text>
  <text x="32" y="710" font-size="11" fill="#D0C4B5"> 4.8 � 25 min � �40 delivery</text>
