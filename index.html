<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/orderbhojan-logo.png" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-512.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050403" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="OrderBhojan — home-cooked meals from cloud kitchens near you." />
    <link rel="preconnect" href="https://manaintibojanam-backend.onrender.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <title>OrderBhojan</title>
    <script>
      if (window.location.protocol === 'capacitor:') {
        window.__SKIP_SPLASH__ = true;
      }
      var EXPECTED_PWA_CACHE_PREFIX = 'orderbhojan-pwa-v11';
      if ('caches' in window) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) {
            if (
              /orderbhojan-pwa-v/i.test(key) &&
              key.indexOf(EXPECTED_PWA_CACHE_PREFIX) === -1
            ) {
              caches.delete(key);
            }
          });
        });
      }
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            var worker = registration.active || registration.waiting || registration.installing;
            var scriptUrl = worker && worker.scriptURL ? worker.scriptURL : '';
            var isOrderBhojanSw = /\/sw\.js(\?|$)/.test(scriptUrl);
            var isFirebaseMessagingSw = /\/firebase-messaging-sw\.js(\?|$)/.test(scriptUrl);
            if (scriptUrl && !isOrderBhojanSw && !isFirebaseMessagingSw) {
              registration.unregister();
              return;
            }
            registration.update();
          });
        });
      }
    </script>
  </head>
  <body>
    <div id="root">
      <div
        id="ob-boot-shell"
        style="min-height:100dvh;background:#050403;color:#fff8f0;font-family:Figtree,system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(1rem,env(safe-area-inset-top)) 1rem max(1rem,env(safe-area-inset-bottom))"
        aria-hidden="true"
      >
        <img
          src="/brand/orderbhojan-logo.png"
          alt=""
          width="88"
          height="88"
          style="width:5.5rem;height:5.5rem;border-radius:1.25rem;box-shadow:0 0 40px -8px rgba(232,93,4,0.55)"
        />
        <p style="margin:1rem 0 0;font-size:11px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:rgba(255,255,255,0.55)">
          Home Food · Faster · Healthier
        </p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
