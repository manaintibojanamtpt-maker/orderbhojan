    <noscript><link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,650;9..144,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>
    <title>OrderBhojan</title>

  <body>
    <div id="root">
      <div
        id="ob-boot-shell"
        style="min-height:100dvh;background:#070504;color:#fffaf3;font-family:Figtree,system-ui,sans-serif;display:flex;flex-direction:column"
        aria-hidden="true"
      >
        <div style="padding:max(1rem,env(safe-area-inset-top)) 1rem 1rem">
          <div style="height:2.5rem;width:60%;border-radius:1rem;background:rgba(255,255,255,0.06)"></div>
          <div style="height:1rem;width:40%;margin-top:0.75rem;border-radius:0.5rem;background:rgba(255,255,255,0.04)"></div>
        </div>
        <div style="flex:1;padding:0 1rem;display:flex;flex-direction:column;gap:0.75rem">
          <div style="height:7rem;border-radius:1.25rem;background:rgba(255,255,255,0.05)"></div>
          <div style="height:7rem;border-radius:1.25rem;background:rgba(255,255,255,0.04)"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
