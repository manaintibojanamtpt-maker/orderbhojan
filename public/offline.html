<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070504" />
    <title>Offline — OrderBhojan</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: max(1.5rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right))
          max(1.5rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
        font-family: Figtree, system-ui, sans-serif;
        background: #070504;
        color: #fffaf3;
        text-align: center;
      }
      main {
        max-width: 22rem;
      }
      h1 {
        margin: 0 0 0.75rem;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        color: rgba(255, 250, 243, 0.72);
        line-height: 1.5;
      }
      button {
        min-height: 44px;
        min-width: 44px;
        padding: 0.75rem 1.25rem;
        border: 0;
        border-radius: 999px;
        background: linear-gradient(135deg, #ff6b35, #ff9f1c);
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button:focus-visible {
        outline: 2px solid #ff7a00;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>OrderBhojan needs a connection for live menus, checkout, and order updates. Check your network and try again.</p>
      <button type="button" id="retry">Try again</button>
    </main>
    <script>
      async function probeReachable() {
        try {
          const response = await fetch('/favicon.svg', { cache: 'no-store', credentials: 'same-origin' });
          return response.ok;
        } catch (error) {
          return typeof navigator !== 'undefined' ? navigator.onLine : false;
        }
      }

      async function tryAgain() {
        const button = document.getElementById('retry');
        if (button) {
          button.disabled = true;
          button.textContent = 'Reconnecting…';
        }

        if (await probeReachable()) {
          const target = new URL('/', window.location.href);
          target.searchParams.set('_retry', String(Date.now()));
          window.location.replace(target.toString());
          return;
        }

        if ('serviceWorker' in navigator) {
          try {
            const registrations = await navigator.serviceWorker.getRegistrations();
            await Promise.all(registrations.map((registration) => registration.update()));
          } catch (error) {
            // Ignore SW update errors and fall back to reload.
          }
        }

        window.location.reload();
      }

      document.getElementById('retry')?.addEventListener('click', () => {
        void tryAgain();
      });
    </script>
  </body>
</html>
