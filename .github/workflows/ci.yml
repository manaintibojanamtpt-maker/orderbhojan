name: OrderBhojan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout backend sibling for customer integration tests
        run: git clone --depth 1 --branch review/phaseb-projection-grants https://github.com/manaintibojanamtpt-maker/manaintibojanam-backend.git ../manaintibojanam-backend || git clone --depth 1 https://github.com/manaintibojanamtpt-maker/manaintibojanam-backend.git ../manaintibojanam-backend

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Build marketplace contracts
        run: npm run build --prefix packages/marketplace-contracts

      - name: Link storefront design-system peer deps for tsc
        run: node scripts/link-storefront-peer-deps.mjs

      - name: Production readiness gate
        run: npm run gate:prod

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
