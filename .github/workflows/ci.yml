name: OrderBhojan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build vendored workspace packages
        run: |
          npm run build --prefix packages/marketplace-contracts
          npm run build --prefix packages/design-system

      - name: Production readiness gate
        run: npm run gate:prod

      - name: Security audit
        run: npm audit --audit-level=high
        continue-on-error: true
